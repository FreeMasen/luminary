[package]
name = "luminary"
version.workspace = true
edition.workspace = true
repository = "https://github.com/FreeMasen/luminary"
homepage = "https://gh.freemasen.com/luminary"
authors = ["Robert Masen <r.f.masen@gmail.com>"]
description = "A compiler for lua."

[dependencies]
analisar = "0.4"
bstr = "1.9"
clap = { version = "4.4", features = ["derive"] }
env_logger = "0.11"
inkwell = { version = "0.4", features = ["llvm16-0"], optional = true }
lex_lua = "0.2.0"
log = "0.4"
rand = "0.8"
runtime = { package = "luminary-runtime", path = "crates/runtime-lib", features = [
    "names",
] }
tempfile = "3.8"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd-sys = { version = "2.0.12+zstd.1.5.6" }

[features]
default = ["codegen"]
codegen = ["dep:inkwell"]



[dev-dependencies]
escargot = "0.5"
insta = "1.31"
mlua = { version = "0.9", features = ["lua53", "vendored"] }
proptest = "1.2"
serde_json = "1"
uuid = { version = "1.10", features = ["v4"] }

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0-junk1"
edition = "2021"
publish = true
