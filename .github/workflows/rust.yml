name: Rust

on:
  push:
    branches: 
      - "main"
  pull_request:
    branches: 
      - "main"

env:
  CARGO_TERM_COLOR: always
  # PKG_CONFIG_PATH: '/opt/homebrew/opt/zstd/lib/pkgconfig:/opt/homebrew/opt/lz4/lib/pkgconfig:/opt/homebrew/opt/xz/lib/pkgconfig'
  # PKG_CONFIG_LIBDIR: '/usr/lib/pkgconfig:/opt/homebrew/Library/Homebrew/os/mac/pkgconfig/14'
  # OBJC: clang
  # CC: clang
  # OBJCXX: clang++
  # CXX: clang++
jobs:
  test_runtime:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run tests
      run: cargo test-runtime
      env: 
        LUMINARY_PRINT_TVALUE: 1
  integration_tests:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
      fail-fast: false
    runs-on: ${{matrix.os}}
    env:
      LUMINARY_USE_VERBOSE_CLANG: 1
    steps:
    - uses: actions/checkout@v3
    - name: Install LLVM and Clang (Linux)
      id: install
      uses: FreeMasen/llvm-install-action@v1.0.3
      with:
        version: 16.0.6
    - name: Install cargo-dist
      # we specify bash to get pipefail; it guards against the `curl` command
      # failing. otherwise `sh` won't catch that `curl` returned non-0
      shell: bash
      run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.20.0-prerelease.3/cargo-dist-installer.sh | sh"
    - name: Build & install
      run: |
        cargo dist build \
        && tar -xf ./target/distrib/luminary-aarch64-apple-darwin.tar.xz --strip-components 1 --include '*/luminary' \
        && echo "LUMINARY_CMD="$PWD/luminary"" >> $GITHUB_ENV
    - name: Run Link Integration Tests
      run: cargo test-codegen --test link
    - name: Run Math Integration Tests
      run: cargo test-codegen --test math
    - name: Run Basic Functions Integration Tests
      run: cargo test-codegen --test basic_fns
    - name: Run Basic Functions Integration Tests
      run: cargo test-codegen --test logic
