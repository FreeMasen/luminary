- name: Install zstd aarch
  if: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' }}
  run: |
    brew fetch --force --bottle-tag=arm64_big_sur zstd
    brew install $(brew --cache --bottle-tag=arm64_big_sur zstd)
- name: Install LLVM and Clang
  id: install
  uses: FreeMasen/llvm-install-action@v1.0.3
  with:
    version: 16.0.6
